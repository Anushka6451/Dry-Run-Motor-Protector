<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>Create Account — Pump Protector</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <section class="auth-screen">
    <div>
      <div class="back-row">
        <a class="icon-btn" href="index.html" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      </div>
      <div class="brand" style="margin-top:20px;">
        <h1>Create Account</h1>
        <p>Set up your Pump Protector account</p>
      </div>
    </div>
    <form class="form-card" id="signupForm" onsubmit="event.preventDefault(); doSignUp();">
      <div class="field">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="e.g. Ramesh Kumar" required autocomplete="name">
      </div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <button class="btn btn-green" type="submit" id="btnSignUp">Create Account</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="signin.html">Sign In</a>
    </div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
  redirectIfAuthed('home.html');

  function doSignUp() {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const pass = document.getElementById('signupPassword').value;
    if (!name || !email || !pass) {
      toast('Please fill in all fields', 'error');
      return;
    }
    saveAuth({ name, email });
    toast('Account created successfully', 'success');
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 400);
  }
</script>
</body>
</html>
