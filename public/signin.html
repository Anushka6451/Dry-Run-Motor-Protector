<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>Sign In — Pump Protector</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <section class="auth-screen">
    <div>
      <div class="back-row">
        <a class="icon-btn" href="index.html" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      </div>
      <div class="brand" style="margin-top:20px;">
        <h1>Welcome Back</h1>
        <p>Sign in to your Pump Protector account</p>
      </div>
    </div>
    <form class="form-card" id="signinForm" onsubmit="event.preventDefault(); doSignIn();">
      <div class="field">
        <label for="signinEmail">Email</label>
        <input type="email" id="signinEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signinPassword">Password</label>
        <input type="password" id="signinPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn btn-green" type="submit" id="btnSignIn">Sign In</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
  redirectIfAuthed('home.html');

  function doSignIn() {
    const email = document.getElementById('signinEmail').value.trim();
    const pass = document.getElementById('signinPassword').value;
    if (!email || !pass) {
      toast('Please enter both email and password', 'error');
      return;
    }
    const name = email.split('@')[0];
    saveAuth({ name: name.charAt(0).toUpperCase() + name.slice(1), email });
    toast('Signed in successfully', 'success');
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 400);
  }
</script>
</body>
</html>
