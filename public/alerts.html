<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>Safety Alerts — Pump Protector</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div class="app-header">
    <div class="title-block">
      <h2>Safety Alerts</h2>
      <p id="alertsSub">Checking logs…</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="handleClear()" title="Clear Alert History">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="18" height="18">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="content" id="alertsList">
    <!-- Populated dynamically -->
  </div>

  <div id="bottomNav"></div>
</div>

<script src="js/app.js"></script>
<script>
  requireAuth();
  injectNav('alerts');

  function renderAlerts() {
    const list = loadAlerts();
    const container = document.getElementById('alertsList');
    document.getElementById('alertsSub').textContent = list.length === 0 ? 'All systems normal' : `${list.length} event${list.length > 1 ? 's' : ''} recorded`;

    if (list.length === 0) {
      container.innerHTML = `
        <div class="card empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <p style="color:var(--ink); font-weight:800; font-size:16px; margin-bottom:4px;">No Faults Logged</p>
          <p style="color:var(--ink-secondary); font-size:13px;">Dry-run trips, water loss events, and safety shutdowns will appear here automatically.</p>
        </div>`;
      return;
    }

    container.innerHTML = list.map((a, idx) => `
      <div class="card alert-card">
        <div class="alert-icon red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        </div>
        <div class="alert-body">
          <h3>${a.fault || 'Dry-Run Event'}</h3>
          <p>${a.detail || 'Pump motor automatically disengaged to protect against dry borehole damage.'}</p>
          <div class="alert-time">${new Date(a.time).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'medium' })}</div>
        </div>
      </div>`).join('');
  }

  function handleClear() {
    clearAlerts();
    renderAlerts();
    toast('Alert log cleared', 'info');
  }

  renderAlerts();
  startPolling(() => renderAlerts());
</script>
</body>
</html>
